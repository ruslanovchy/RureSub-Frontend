            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <!-- / -->
        <line
            x1="26"
            y1="15"
            x2="22"
            y2="33"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
        />
    </g>


</svg>
