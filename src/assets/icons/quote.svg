<svg width="64" height="64" viewBox="0 0 64 64" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Quote icon</title>
  <desc>Opening double quotation marks, scaled to fit with 4px padding</desc>
  <style>
    .s { fill: #1c1c1e; }
    @media (prefers-color-scheme: dark) { .s { fill: #f2f2f7; } }
  </style>

  <!-- 
    Центрирование и масштабирование:
    Исходные элементы занимали примерно 40x40. 
    Масштаб 1.4 позволяет им занять 56x56, оставляя ровно 4px padding (64 - 56 = 8 / 2 = 4).
  -->
  <g class="s" transform="translate(32, 32) scale(1.4) translate(-28, -25)">
    <!-- Левая кавычка -->
    <g transform="translate(10, 0)">
      <ellipse cx="9" cy="34" rx="7" ry="7"></ellipse>
      <path d="
        M3.2 30
        C2 26 3 20 5 16
        C7 12 10 10 11 9
        C12 8 12.5 8.5 12 9.5
        C11 11 9.5 13 8.5 16
        C7.5 19 7 23 8 27
        C8.5 29 9 30.5 9 31
        L3.2 30Z
      "></path>
    </g>

    <!-- Правая кавычка -->
    <g transform="translate(30, 0)">
      <ellipse cx="9" cy="34" rx="7" ry="7"></ellipse>
      <path d="
        M3.2 30
        C2 26 3 20 5 16
        C7 12 10 10 11 9
        C12 8 12.5 8.5 12 9.5
        C11 11 9.5 13 8.5 16
        C7.5 19 7 23 8 27
        C8.5 29 9 30.5 9 31
        L3.2 30Z
      "></path>
    </g>
  </g>
</svg>
