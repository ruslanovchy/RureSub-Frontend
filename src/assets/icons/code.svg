<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    width="64"
    height="64"
>
    <!-- 
      scale(1.5) увеличивает сами элементы.
      translate(-4, -4) корректирует положение, чтобы увеличенная иконка осталась в центре.
    -->
    <g transform="translate(-4, -4) scale(1.5)">
        <!-- < -->
        <polyline
            points="17,16 9,24 17,32"
            fill="none"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <!-- > -->
        <polyline
            points="31,16 39,24 31,32"
            fill="none"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <!-- / -->
        <line
            x1="27"
            y1="14"
            x2="21"
            y2="34"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
        />
    </g>
</svg>
